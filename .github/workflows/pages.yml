name: Diagnòstic de connexió a HoqueiHub
on:
  workflow_dispatch:
    inputs:
      source:
        type: string
        default: all
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock linkedom@0.18.12
      - name: Recupera un marcador conegut per a cada equip en una còpia de prova
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile, writeFile} from 'node:fs/promises';
          import {DOMParser} from 'linkedom';
          import {fetchHubCalendar, mergeHubCalendar} from './scripts/hoqueihub.mjs';
          import {updateAll} from './scripts/update-teams.mjs';

          const read=async path=>JSON.parse(await readFile(path,'utf8'));
          const config=await read('public/ui/teams.json');
          const calendars=new Map();
          const fetchHub=path=>{
            if(!calendars.has(path))calendars.set(path,fetchHubCalendar(path,DOMParser));
            return calendars.get(path);
          };
          const expected=[];
          for(const team of config.teams){
            const file='public/ui/'+team.file;
            const data=await read(file);
            const fixtures=await fetchHub(team.hubGroup);
            const played=data.matches.find(m=>m.score&&
              (m.home===data.team||m.away===data.team)&&
              mergeHubCalendar({...data,matches:[{...m,score:null}]},fixtures,{now:Date.now(),aliases:team.hubAliases})
                .data.matches[0].score?.join('-')===m.score.join('-'));
            assert.ok(played,team.id);
            expected.push({file,id:played.id,score:played.score,team:team.id});
            played.score=null;
            await writeFile(file,JSON.stringify(data));
          }
          const sync=await updateAll(async()=>{throw Error('Font federativa desconnectada a la prova');},{fetchHub});
          assert.equal(sync.checked,18);
          assert.equal(sync.changedFiles,18);
          assert.equal(sync.errors,0);
          for(const item of expected){
            const data=await read(item.file);
            assert.deepEqual(data.matches.find(m=>m.id===item.id).score,item.score,item.team);
            console.log(item.team+' · marcador recuperat '+item.score.join('-'));
          }
          console.log('18/18 marcadors comprovats.');
          NODE
