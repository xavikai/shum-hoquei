name: Diagnòstic de connexió a HoqueiHub
on:
  workflow_dispatch:
    inputs:
      source:
        type: string
        default: all
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock linkedom@0.18.12
      - name: Prova el client de producció per a tots els grups
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {DOMParser} from 'linkedom';
          import {parseHubCalendar} from './scripts/hoqueihub.mjs';
          const config=JSON.parse(fs.readFileSync('public/ui/teams.json','utf8'));
          const headers={'User-Agent':'SHUM Hoquei (+https://xavikai.github.io/shum-hoquei/)','Accept':'text/html'};
          const groups=new Map();
          let checked=0;
          for (const team of config.teams) {
            if(!groups.has(team.hubGroup)){
              const url=new URL(team.hubGroup,'https://hoqueihub.cat/');
              const response=await fetch(url,{headers,signal:AbortSignal.timeout(15000)});
              const html=execFileSync('curl',['--disable','--silent','--show-error','--max-time','15','--user-agent',headers['User-Agent'],'--header','Accept: text/html','--write-out','\n%{http_code}',url.href],{encoding:'utf8',maxBuffer:4*1024*1024});
              const split=html.lastIndexOf('\n');
              console.log('curl',url.pathname,html.slice(split+1));
              console.log(url.pathname,response.status,response.headers.get('cf-mitigated')||'');
              let matches=0;
              if(html.slice(split+1)==='200')matches=parseHubCalendar(new DOMParser().parseFromString(html.slice(0,split),'text/html')).length;
              groups.set(team.hubGroup,matches);
            }
            const count=groups.get(team.hubGroup);
            if(count)checked++;
            console.log(team.id,count);
          }
          console.log(checked+'/'+config.teams.length+' equips consultats');
          if(checked!==config.teams.length)process.exitCode=1;
          NODE
