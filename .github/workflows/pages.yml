name: Diagnòstic de connexió a HoqueiHub
on:
  workflow_dispatch:
    inputs:
      source:
        type: string
        default: all
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prova les rutes públiques
        shell: bash
        run: |
          probe () {
            local url="$1"
            shift
            local marker
            marker=$(curl --silent --show-error --max-time 15 -D "$RUNNER_TEMP/shum-headers" -o "$RUNNER_TEMP/shum-response" -w '%{http_code}' "$@" "$url")
            echo "$url: HTTP $marker"
            grep -iE '^(server|cf-ray|cf-mitigated|content-type|retry-after|location|x-block-reason):' "$RUNNER_TEMP/shum-headers" || true
            if [ "$marker" -ge 400 ]; then head -c 800 "$RUNNER_TEMP/shum-response"; echo; fi
          }
          probe https://hoqueihub.cat/robots.txt
          probe https://hoqueihub.cat/legal
          probe https://hoqueihub.cat/group/7081-infantil-or-8-temporada-2026-27
          probe https://hoqueihub.cat/group/7039-grup-unic-temporada-2026-27 -A 'SHUM Hoquei (+https://xavikai.github.io/shum-hoquei/)' -H 'Accept: text/html'
